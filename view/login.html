<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Aqui tem Terapia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header>
      <div class="logo">Aqui tem Terapia!</div>
      <nav>
        <a class="cta" href="tela_inicial.html">Início</a>
      </nav>
    </header>

    <main class="login-centered">
      <section class="content" aria-labelledby="login-title">
        <h1 id="login-title">Faça seu login</h1>
        <p class="lead">Acesse sua conta para gerenciar suas consultas.</p>

        <form class="form" action="../controller/gerenciar_usuarios.php" method="post" aria-label="Formulário de login">
          <input type="hidden" name="acao" value="login">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-primary">Entrar</button>
          
          <p style="text-align:center;margin-top:16px;color:var(--muted)">
            Não tem conta? <a href="cadastro.html" style="color:var(--cta-bg);font-weight:700;text-decoration:none">Cadastre-se aqui</a>
          </p>
          <p style="text-align:center;margin-top:16px;color:var(--muted)">
            Esqueceu a senha? <a href="recuperar_senha.html" style="color:var(--cta-bg);font-weight:700;text-decoration:none">Recuperar senha</a>
          </p>
            <a href="redefinir_senha.html" style="color:var(--cta-bg);font-weight:700;text-decoration:none">Redefinir senha</a>

        </form>
      </section>
    </main>

    <footer>© 2025 Aqui tem Terapia! | Contato via WhatsApp</footer>
  </div>
</body>
</html>
