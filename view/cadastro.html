<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro — Aqui tem Terapia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header>
      <div class="logo">Aqui tem Terapia!</div>
      <nav>
        <a class="cta" href="tela_inicial.html">Início</a>
        <a class="cta" href="login.html">Login</a>
        <a class="cta" href="perfil.html">Perfil</a>
        <a class="cta" href="contato.html">Contato</a>
      </nav>
    </header>
    <main class="login-centered">
      <section class="content" aria-labelledby="signup-title">
        <h1 id="signup-title">Crie sua conta</h1>
        <p class="lead">Cadastre-se para agendar suas consultas.</p>

        <form id="signup-form" class="form" action="../controller/gerenciar_usuarios.php" method="post" aria-label="Criar nova conta">
          <input type="hidden" name="acao" value="criar">

          <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
          </div>

          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
          </div>

          <div class="input-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" required>
          </div>

          <div class="input-group">
            <label for="dtnas">Data de Nascimento</label>
            <input type="date" id="dtnas" name="dtnas" required>
          </div>

          <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
          </div>

          <div class="input-group">
            <label for="confirma-senha">Confirmar Senha</label>
            <input type="password" id="confirma-senha" name="confirma_senha" placeholder="••••••••" required>
          </div>

          <input type="hidden" name="tipo" value="usuario">

          <div class="input-group">
            <button type="submit" class="btn-primary">Criar Conta</button>
          </div>

          <div class="social-login">
            <p style="text-align:center;margin:16px 0;color:var(--muted)">Ou entre com</p>

            <button type="button" class="btn-social google">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 31.9 29.3 35 24 35c-7 0-12.6-5.6-12.6-12.6S17 9.8 24 9.8c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.9 3.2 29.7 1 24 1 12.4 1 3 10.4 3 22s9.4 21 21 21c11.4 0 20.6-8.3 20.6-21 0-1.1-.1-2.2-.3-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.4 16.3 18.8 13.4 24 13.4c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.9 7.7 29.7 5.5 24 5.5c-7.5 0-14 4.3-17.3 10.5z"/>
                <path fill="#4CAF50" d="M24 43.5c5.2 0 10-2 13.5-5.4l-6.2-5.3c-2 1.4-4.6 2.2-7.3 2.2-5.3 0-9.8-3.1-11.7-7.6l-6.6 5.1C8.3 38.8 15.6 43.5 24 43.5z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.6 3.9-5.4 6.5-10.3 6.5-2.7 0-5.3-.8-7.3-2.2l-6.2 5.3C15.6 41.5 20.4 43.5 25.6 43.5c11.4 0 20.6-8.3 20.6-21 0-1.1-.1-2.2-.3-3.5z"/>
              </svg>
              Entrar com Google
            </button>

            <button type="button" class="btn-social facebook">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9V12.06h2.54V9.84c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34v7.03C18.34 21.21 22 17.06 22 12.06z"/>
              </svg>
              Entrar com Facebook
            </button>
          </div>

          <p style="text-align:center;margin-top:16px;color:var(--muted)">Já tem conta? 
            <a href="login.html" style="color:var(--cta-bg);font-weight:700;text-decoration:none">Faça login</a>
          </p>
        </form>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const telefoneInput = document.getElementById("telefone");

        telefoneInput.addEventListener("input", function(e) {
          let valor = e.target.value.replace(/\D/g, ""); // remove tudo que não é número

          if (valor.length > 11) valor = valor.slice(0, 11); // limita a 11 dígitos

          if (valor.length <= 10) {
            // formato (XX) XXXX-XXXX
            valor = valor.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
          } else {
            // formato (XX) XXXXX-XXXX
            valor = valor.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
          }

          e.target.value = valor;
        });
      });

      document.getElementById('signup-form').addEventListener('submit', function(e){
        var s = document.getElementById('senha').value;
        var c = document.getElementById('confirma-senha').value;
        if(s !== c){
          e.preventDefault();
          alert('As senhas não coincidem.');
          return false;
        }
        return true;
      });

      document.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("success") === "1") {
          alert("Usuário cadastrado com sucesso!");
      }
    });    
  </script>

    <footer>© 2025 Aqui tem Terapia! | Contato via WhatsApp</footer>
  </div>
</body>
</html>
